name: Build Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app-mobile/**'
      - 'core/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/build-mobile-apk.yml'

jobs:
  build:
    name: Build app-mobile Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Debug APK
        run: |
          # The committed gradle.properties pins org.gradle.java.home to a
          # local macOS Android Studio path; point it at the runner JDK.
          ./gradlew :app-mobile:assembleDebug --console=plain -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: idlix-mobile-debug-apk
          path: app-mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
